<!doctype html>
<html lang="en" data-theme="light" data-font="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexicon Terms &middot; IEC 62305-3</title>
<meta name="description" content="Russian-English terminology drill for translators. IEC 62305-3, lightning protection. Works offline.">
<meta name="theme-color" content="#edefea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terms">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ==================================================================
   Lexicon Terms — an engineering drawing sheet you can drill on.
   Palette: drafting ink on cool paper, blueprint blue for structure,
   brass for the lightning current, vermilion for hazard.
   ================================================================== */

:root {
  --paper:   #edefea;
  --sheet:   #f7f8f5;
  --ink:     #17242b;
  --ink-2:   #5c6b72;
  --ink-3:   #8a979c;
  --line:    #c3ccc9;
  --line-2:  #dde3df;
  --blue:    #2e5b7a;
  --brass:   #a8741c;
  --red:     #a63a32;
  --green:   #3f6b4e;
  --shadow:  0 1px 0 rgba(23,36,43,.06), 0 12px 28px -20px rgba(23,36,43,.5);

  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  --sans:  "PT Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:  "PT Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --scale: 1;
  --pad: 18px;
  --radius: 3px;
}

html[data-theme="dark"] {
  --paper:  #10171b;
  --sheet:  #182126;
  --ink:    #dee6e4;
  --ink-2:  #93a5a8;
  --ink-3:  #6d7f83;
  --line:   #2f3d43;
  --line-2: #232f34;
  --blue:   #7fb3d0;
  --brass:  #dfae52;
  --red:    #dc7a70;
  --green:  #7db28f;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 30px -22px #000;
}

html[data-font="system"] {
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: calc(16px * var(--scale));
  line-height: 1.5;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}

/* the sheet's faint drafting grid ------------------------------- */
body[data-texture="grid"]::before,
body[data-texture="graph"]::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  opacity: .55;
}
body[data-texture="grid"]::before {
  background-image:
    linear-gradient(var(--line-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-2) 1px, transparent 1px);
  background-size: 96px 96px, 96px 96px;
}
body[data-texture="graph"]::before {
  background-image:
    linear-gradient(var(--line-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-2) 1px, transparent 1px);
  background-size: 24px 24px, 24px 24px;
}

#app { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; min-height: 100%;
       display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- title block */
.titleblock {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) var(--pad) 8px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky; top: 0; z-index: 20;
}
.tb-code { font-family: var(--mono); font-size: .68em; letter-spacing: .08em;
           text-transform: uppercase; color: var(--ink-2); }
.tb-mid  { font-family: var(--mono); font-size: .68em; letter-spacing: .06em;
           text-align: center; color: var(--ink-3); text-transform: uppercase; }
.tb-right{ font-family: var(--mono); font-size: .8em; color: var(--ink); font-variant-numeric: tabular-nums; }

.iconbtn {
  appearance: none; border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
  border-radius: var(--radius); padding: 5px 9px; font-family: var(--mono); font-size: .72em;
  cursor: pointer; letter-spacing: .04em;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible, .card:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 2px;
}

/* ---------------------------------------------------------------- dimension progress */
.dimline { display: flex; align-items: center; gap: 3px; padding: 8px var(--pad) 0; }
.tick { flex: 1; height: 10px; border-left: 1px solid var(--line); position: relative; }
.tick:last-child { border-right: 1px solid var(--line); }
.tick::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
               background: var(--line); transition: background .2s; }
.tick[data-s="right"]::after { background: var(--green); }
.tick[data-s="wrong"]::after { background: var(--red); }
.tick[data-s="now"]::after   { background: var(--brass); height: 3px; }

/* ---------------------------------------------------------------- screens */
.screen { flex: 1; padding: 0 var(--pad) calc(28px + env(safe-area-inset-bottom)); }
.screen[hidden] { display: none; }

.eyebrow { font-family: var(--mono); font-size: .68em; letter-spacing: .12em;
           text-transform: uppercase; color: var(--ink-3); margin: 20px 0 6px; }

h1 { font-family: var(--serif); font-weight: 700; font-size: 1.7em; line-height: 1.15;
     margin: 0 0 6px; letter-spacing: -.01em; }
h2 { font-family: var(--serif); font-weight: 700; font-size: 1.15em; margin: 0 0 4px; }
p  { margin: 0 0 12px; color: var(--ink-2); }

.lede { font-family: var(--serif); font-size: 1.02em; color: var(--ink-2); margin-bottom: 18px; }

/* hero: the sheet's masthead ------------------------------------- */
.masthead { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line);
            padding: 14px 0 16px; margin-top: 12px; }
.masthead .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.masthead .stat { font-family: var(--mono); font-size: .72em; color: var(--ink-2); }

/* ---------------------------------------------------------------- card list */
.cardlist { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 8px; }
.card {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; text-align: left; width: 100%;
  font: inherit; color: inherit; box-shadow: var(--shadow);
}
.card:active { transform: translateY(1px); }
.card .num { font-family: var(--mono); font-size: 1.1em; color: var(--brass); }
.card .name { font-family: var(--serif); font-weight: 700; font-size: 1.02em; line-height: 1.2; }
.card .sub  { font-family: var(--mono); font-size: .66em; color: var(--ink-3); letter-spacing: .04em;
              text-transform: uppercase; margin-top: 3px; }
.card .meter { width: 40px; height: 40px; }

/* ---------------------------------------------------------------- buttons */
.actions { display: flex; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
.btn {
  appearance: none; font: inherit; font-family: var(--sans); cursor: pointer;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  border-radius: var(--radius); padding: 12px 18px; letter-spacing: .01em; flex: 1 1 auto;
  min-height: 46px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #fff; }
html[data-theme="dark"] .btn.brass { color: #1a1206; }
.btn.right { background: var(--green); border-color: var(--green); color: #fff; }
.btn.wrong { background: transparent; border-color: var(--red); color: var(--red); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 8px 12px; min-height: 0; font-size: .86em; flex: 0 0 auto; }

/* ---------------------------------------------------------------- term face */
.face {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px 18px; margin-top: 14px;
  position: relative; overflow: hidden;
}
.face::before {                      /* the current rail — signature element */
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, transparent, var(--brass) 12%, var(--brass) 88%, transparent);
  opacity: .25;
}
.face.live::before { opacity: 1; animation: strike .5s ease-out; }
@keyframes strike {
  from { background-position: 0 -240px; opacity: .2; }
  to   { background-position: 0 0; opacity: 1; }
}

.dir { font-family: var(--mono); font-size: .66em; letter-spacing: .12em; text-transform: uppercase;
       color: var(--ink-3); display: flex; justify-content: space-between; }
.prompt { font-family: var(--serif); font-size: 1.5em; line-height: 1.22; margin: 10px 0 0;
          hyphens: auto; }
.prompt.ru { }
.answer { font-family: var(--serif); font-size: 1.32em; line-height: 1.25; color: var(--blue);
          margin: 12px 0 0; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.rule.dash { border-top-style: dashed; }

.defn { font-size: .84em; color: var(--ink-2); margin-top: 10px; }
.defn b { font-family: var(--mono); font-weight: 400; font-size: .8em; letter-spacing: .1em;
          text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 2px; }

.hint { font-family: var(--mono); font-size: .82em; color: var(--brass); margin-top: 10px;
        letter-spacing: .18em; }

/* ---------------------------------------------------------------- figure */
figure.fig { margin: 14px 0 0; border: 1px solid var(--line-2); border-radius: var(--radius);
             background: var(--paper); padding: 6px; }
figure.fig svg { display: block; width: 100%; height: auto; }
figcaption { font-family: var(--mono); font-size: .62em; letter-spacing: .08em; text-transform: uppercase;
             color: var(--ink-3); padding: 4px 4px 2px; border-top: 1px solid var(--line-2); margin-top: 4px; }

svg.dwg .b { fill: none; stroke: var(--blue); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
svg.dwg .f { fill: var(--blue); opacity: .07; stroke: none; }
svg.dwg .c { fill: none; stroke: var(--brass); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.dwg .x { fill: none; stroke: var(--red); stroke-width: 1.5; stroke-linecap: round; }
svg.dwg .d { fill: none; stroke: var(--ink-3); stroke-width: .7; stroke-linecap: round; }
svg.dwg .n { fill: none; stroke: var(--ink-3); stroke-width: .8; stroke-dasharray: 4 3; }
svg.dwg .h { fill: none; stroke: var(--line); stroke-width: .8; }
svg.dwg .t { fill: var(--ink-2); font-family: var(--mono); font-size: 7px; letter-spacing: .04em; }
svg.dwg .x.t { fill: var(--red); stroke: none; }
svg.dwg circle.c, svg.dwg rect.c, svg.dwg ellipse.c { fill: none; }
svg.dwg .cf { fill: var(--brass); stroke: none; opacity: .45; }
svg.dwg .bolt { stroke-width: 2.1; }

/* ---------------------------------------------------------------- typing */
.typebox { display: flex; gap: 8px; margin-top: 14px; }
.typebox input {
  flex: 1; font: inherit; font-family: var(--serif); font-size: 1.05em;
  padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--paper); color: var(--ink); min-width: 0;
}
.verdict { font-family: var(--mono); font-size: .74em; letter-spacing: .08em; text-transform: uppercase;
           margin-top: 10px; }
button.verdict { appearance: none; display: block; width: 100%; text-align: left; cursor: pointer;
                 background: transparent; border: 0; border-top: 1px solid var(--line-2);
                 padding: 10px 0 0; margin-top: 14px; font-size: .74em; }
button.verdict:active { opacity: .7; }
.verdict .flip { display: block; margin-top: 4px; color: var(--ink-3); letter-spacing: .06em; }
.verdict.ok { color: var(--green); }
.verdict.near { color: var(--brass); }
.verdict.no { color: var(--red); }

/* ---------------------------------------------------------------- learn nav */
.learnnav { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.dots { flex: 1; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.dot { width: 7px; height: 7px; border: 1px solid var(--line); border-radius: 50%; }
.dot.on { background: var(--brass); border-color: var(--brass); }
.dot.past { background: var(--line); }

/* ---------------------------------------------------------------- lists, settings */
.rowlist { display: flex; flex-direction: column; border-top: 1px solid var(--line-2); margin-top: 8px; }
.rowitem { display: flex; justify-content: space-between; align-items: center; gap: 12px;
           padding: 11px 2px; border-bottom: 1px solid var(--line-2); }
.rowitem .l { font-family: var(--serif); }
.rowitem .r { font-family: var(--mono); font-size: .76em; color: var(--ink-2); text-align: right; }
.rowitem.tap { cursor: pointer; }

.optline { display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin: 2px 0 6px; }
.optline .k { font-family: var(--mono); font-size: .68em; letter-spacing: .1em;
              text-transform: uppercase; color: var(--ink-3); }

.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { appearance: none; font: inherit; font-family: var(--mono); font-size: .74em;
              background: transparent; color: var(--ink-2); border: 0; padding: 7px 10px; cursor: pointer;
              border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.search { width: 100%; font: inherit; font-family: var(--sans); padding: 11px 12px; margin-top: 12px;
          border: 1px solid var(--line); border-radius: var(--radius); background: var(--sheet); color: var(--ink); }

.glossitem { padding: 10px 2px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.glossitem .en { font-family: var(--serif); }
.glossitem .ru { font-family: var(--serif); color: var(--blue); font-size: .94em; }
.glossitem .meta { font-family: var(--mono); font-size: .64em; color: var(--ink-3); letter-spacing: .06em; }

.weakmark { color: var(--red); font-family: var(--mono); font-size: .7em; }

/* ---------------------------------------------------------------- footer bar */
.bar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--paper) 28%);
       padding: 14px 0 calc(10px + env(safe-area-inset-bottom)); }

.note { font-family: var(--mono); font-size: .68em; color: var(--ink-3); letter-spacing: .04em; margin-top: 10px; }

.big { font-family: var(--mono); font-size: 2.1em; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--green); } .delta.down { color: var(--red); }

.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 6px; }
.spark i { flex: 1; background: var(--blue); opacity: .5; border-radius: 1px 1px 0 0; min-height: 2px; }
.spark i.best { background: var(--brass); opacity: 1; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
         background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: .76em;
         padding: 9px 14px; border-radius: var(--radius); z-index: 60; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body data-texture="grid">
<div id="app"></div>

<script>
/* version ------------------------------------------------------- */
var APPVER = '1.2';

/* diagrams ------------------------------------------------------ */
/* ------------------------------------------------------------------
   Diagrams. Each entry is the inside of an <svg viewBox="0 0 200 120">.
   Classes:  b structure · f faint fill · c current path · d dimension
             n dashed · x hazard · h hatching · t label
------------------------------------------------------------------- */
const GND = '<line class="b" x1="2" y1="100" x2="198" y2="100"/><path class="h" d="' +
  Array.from({ length: 20 }, (_, i) => 'M' + (8 + i * 10) + ' 100l-5 6').join('') + '"/>';

const bolt = (x, y0, y1) => {
  const h = (y1 - y0) / 3;
  return '<path class="c bolt" d="M' + x + ' ' + y0 + 'l-5 ' + h + ' 6 ' + h + '-1 ' + h + '"/>';
};

const person = (x, y) =>            // y = ground level, figure ~26 high
  '<circle class="b" cx="' + x + '" cy="' + (y - 24) + '" r="4"/>' +
  '<path class="b" d="M' + x + ' ' + (y - 20) + 'v11"/>';

const DIAGRAMS = {

  lps: '<rect class="f" x="58" y="54" width="84" height="46"/><rect class="b" x="58" y="54" width="84" height="46"/>' +
    '<path class="c" d="M100 54v-16"/>' + bolt(100, 8, 36) +
    '<path class="c" d="M100 54h42v52"/><path class="c" d="M124 106h34"/>' + GND +
    '<text class="t" x="104" y="46">1</text><text class="t" x="146" y="80">2</text><text class="t" x="162" y="110">3</text>' +
    '<text class="t" x="6" y="16">1 air-termination</text><text class="t" x="6" y="26">2 down-conductor</text>' +
    '<text class="t" x="6" y="36">3 earth-termination</text>',

  'lps-isolated': '<rect class="f" x="66" y="60" width="68" height="40"/><rect class="b" x="66" y="60" width="68" height="40"/>' +
    '<path class="b" d="M30 100V34M170 100V34"/><path class="c" d="M30 34q70 14 140 0"/>' +
    bolt(100, 8, 40) + '<path class="c" d="M34 100v6h14M166 100v6h-14"/>' + GND +
    '<path class="n" d="M66 52h68"/><text class="t" x="70" y="48">no contact</text>',

  'lps-attached': '<rect class="f" x="58" y="54" width="84" height="46"/><rect class="b" x="58" y="54" width="84" height="46"/>' +
    '<path class="c" d="M78 54v-12M122 54v-12"/><path class="c" d="M78 54h44"/>' +
    '<path class="c" d="M58 54v46M142 54v46"/><circle class="c" cx="58" cy="76" r="2.4"/><circle class="c" cx="142" cy="76" r="2.4"/>' +
    bolt(78, 12, 40) + '<path class="c" d="M48 100v6h16M152 100v6h-16"/>' + GND +
    '<text class="t" x="20" y="76">on the</text><text class="t" x="20" y="86">structure</text>',

  'internal-lps': '<rect class="b" x="30" y="26" width="140" height="74"/>' +
    '<rect class="b" x="46" y="44" width="26" height="18"/><rect class="b" x="88" y="44" width="26" height="18"/>' +
    '<rect class="b" x="130" y="44" width="26" height="18"/><path class="c" d="M40 80h120"/>' +
    '<path class="c" d="M59 62v18M101 62v18M143 62v18"/><path class="c" d="M100 80v20"/>' + GND +
    '<text class="t" x="40" y="94">bonding bar</text><text class="t" x="52" y="40">internal systems</text>',

  'air-term': '<path class="b" d="M14 74h172"/><path class="c" d="M38 74V44"/>' + bolt(38, 18, 42) +
    '<path class="b" d="M82 74V52M126 74V52"/><path class="c" d="M82 52q22 8 44 0"/>' +
    '<path class="c" d="M150 60h34M150 68h34M158 56v16M170 56v16M182 56v16"/>' +
    '<text class="t" x="28" y="88">rod</text><text class="t" x="92" y="88">wire</text><text class="t" x="156" y="88">mesh</text>',

  rod: '<rect class="f" x="52" y="70" width="96" height="30"/><rect class="b" x="52" y="70" width="96" height="30"/>' +
    '<path class="c" d="M100 70V34"/><circle class="c" cx="100" cy="34" r="2"/>' + bolt(100, 6, 32) +
    '<path class="n" d="M100 36 58 92M100 36l42 56"/>' + GND +
    '<text class="t" x="106" y="52">h</text><text class="t" x="62" y="66">protected</text>',

  catenary: '<rect class="f" x="60" y="76" width="80" height="24"/><rect class="b" x="60" y="76" width="80" height="24"/>' +
    '<path class="b" d="M36 100V40M164 100V40"/><path class="c" d="M36 40q64 22 128 0"/>' +
    bolt(100, 8, 46) + '<path class="n" d="M36 40 60 76M164 40l-24 36"/>' + GND +
    '<text class="t" x="86" y="66">catenary wire</text>',

  mesh: '<rect class="f" x="40" y="24" width="120" height="76"/><rect class="b" x="40" y="24" width="120" height="76"/>' +
    '<path class="c" d="M70 24v76M100 24v76M130 24v76M40 48h120M40 72h120"/>' +
    '<path class="d" d="M70 14h30M70 11v6M100 11v6"/><text class="t" x="78" y="9">W</text>' +
    '<text class="t" x="40" y="112">roof plan · mesh size W</text>',

  'down-conductor': '<rect class="f" x="56" y="40" width="88" height="60"/><rect class="b" x="56" y="40" width="88" height="60"/>' +
    '<path class="c" d="M56 40v60M144 40v60M56 40h88"/><path class="c" d="M56 100v6h-14M144 100v6h14"/>' +
    '<path class="c" d="M52 62l4 6 4-6M140 62l4 6 4-6"/>' + GND +
    '<text class="t" x="70" y="72">structure</text><text class="t" x="8" y="114">to earth</text>',

  'natural-component': '<rect class="b" x="56" y="34" width="88" height="66"/>' +
    '<path class="c" d="M64 34v66M80 34v66M96 34v66M112 34v66M128 34v66"/>' +
    '<path class="b" d="M56 52h88M56 70h88M56 88h88"/>' +
